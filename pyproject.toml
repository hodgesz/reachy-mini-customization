[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy-mini-customization"
version = "0.2.0"
description = "Shared hello and Auburn celebration routines for Reachy Mini"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
reachy-hello = "reachy_customizations.cli:hello_main"
auburn-celebration = "reachy_customizations.cli:auburn_main"

[tool.setuptools.packages.find]
where = ["src"]
